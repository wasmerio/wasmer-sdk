name: Publish JavaScript to npm

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: Synchronize wasmer-sh after an existing npm publication
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build @wasmer/sdk2
    if: github.ref == 'refs/heads/main' && inputs.sync_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: ./.github/actions/cache-sdk
        with:
          cargo-profile: js-nightly
          cache-compiled-artifacts: "false"

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.126"; then
            cargo +nightly install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Validate package identity
        working-directory: js
        run: |
          test "$(node --print "require('./package.json').name")" = "@wasmer/sdk2"
          sdk_npm_version="$(node --print "require('./package.json').version")"
          echo "Publishing @wasmer/sdk2@${sdk_npm_version}"
          if npm view "@wasmer/sdk2@${sdk_npm_version}" version >/dev/null 2>&1; then
            echo "::error::@wasmer/sdk2@${sdk_npm_version} is already published"
            exit 1
          fi
          npm --version

      - name: Build
        working-directory: js
        run: npm run build

      - name: Test
        working-directory: js
        run: timeout --kill-after=30s 6m npm test

      - name: Pack package
        working-directory: js
        run: |
          npm pack --dry-run
          mkdir -p ../npm-package
          npm pack --pack-destination ../npm-package

      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-sdk2-${{ github.sha }}
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish @wasmer/sdk2
    needs: build
    if: inputs.sync_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: wasmer-sdk2-${{ github.sha }}
          path: npm-package

      - name: Publish with npm trusted publishing
        run: npm publish ./npm-package/*.tgz --access public

  sync-wasmer-sh:
    name: Update wasmer-sh to the published SDK
    needs:
      - build
      - publish
    if: >-
      always() &&
      (needs.publish.result == 'success' || inputs.sync_only == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Update wasmer-sh package manifests
        run: node .github/scripts/sync-wasmer-sh-sdk-version.mjs

      - name: Regenerate dependency lockfiles
        run: |
          npm --prefix wasmer-sh install --package-lock-only --ignore-scripts
          npm --prefix wasmer-sh/service-worker install \
            --package-lock-only --ignore-scripts
          pnpm --dir wasmer-sh install --lockfile-only --ignore-scripts

      - name: Validate the published dependency
        run: node .github/scripts/sync-wasmer-sh-sdk-version.mjs --check

      - name: Build wasmer-sh from clean installs
        run: |
          npm --prefix wasmer-sh ci --ignore-scripts
          npm --prefix wasmer-sh/service-worker ci --ignore-scripts
          npm --prefix wasmer-sh run build

      - name: Commit the synchronized dependency
        id: commit
        shell: bash
        run: |
          git add \
            wasmer-sh/package.json \
            wasmer-sh/package-lock.json \
            wasmer-sh/pnpm-lock.yaml \
            wasmer-sh/service-worker/package.json \
            wasmer-sh/service-worker/package-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sdk_version="$(node --print \
            "require('./js/package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m \
            "Use @wasmer/sdk2 ${sdk_version} in wasmer-sh"
          git push origin HEAD:main
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Run CI for the synchronized commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
