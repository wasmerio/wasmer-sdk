name: Publish JavaScript to npm

on:
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build @wasmer/sdk2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: ./.github/actions/cache-sdk
        with:
          cargo-profile: js-nightly
          cache-compiled-artifacts: "false"

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.126"; then
            cargo +nightly install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Validate package identity
        working-directory: js
        run: |
          test "$(node --print "require('./package.json').name")" = "@wasmer/sdk2"
          sdk_npm_version="$(node --print "require('./package.json').version")"
          echo "Publishing @wasmer/sdk2@${sdk_npm_version}"
          if npm view "@wasmer/sdk2@${sdk_npm_version}" version >/dev/null 2>&1; then
            echo "::error::@wasmer/sdk2@${sdk_npm_version} is already published"
            exit 1
          fi
          npm --version

      - name: Build
        working-directory: js
        run: npm run build

      - name: Test
        working-directory: js
        run: timeout --kill-after=30s 6m npm test

      - name: Pack package
        working-directory: js
        run: |
          npm pack --dry-run
          mkdir -p ../npm-package
          npm pack --pack-destination ../npm-package

      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-sdk2-${{ github.sha }}
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish @wasmer/sdk2
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: wasmer-sdk2-${{ github.sha }}
          path: npm-package

      - name: Mint npm OIDC token
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken("npm:registry.npmjs.org");
            core.setSecret(token);
            core.exportVariable("NPM_ID_TOKEN", token);

      - name: Publish with npm trusted publishing
        run: npm publish ./npm-package/*.tgz --access public
