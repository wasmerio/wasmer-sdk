name: Publish JavaScript to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing JS release tag whose attached tarball will be published
        required: true
        type: string
      sync_only:
        description: Synchronize wasmer-sh after an existing npm publication
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @wasmer/sdk
    if: github.ref == 'refs/heads/main' && inputs.sync_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^wasmer-sdk-js-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - name: Download and verify the exact GitHub release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/sdk_release.py check --component js --tag "$RELEASE_TAG"
          python .github/scripts/github_release.py download --component js --assets release-dist
          python .github/scripts/registry_pending.py --component js --assets release-dist --output pending
      - name: Publish any remaining tarball with npm trusted publishing
        shell: bash
        run: |
          shopt -s nullglob
          # Without ./, npm interprets pending/<name> as a GitHub repository.
          tarballs=(./pending/*.tgz)
          if [ "${#tarballs[@]}" -gt 0 ]; then
            npm publish "${tarballs[0]}" --access public
          fi

  sync-wasmer-sh:
    name: Update wasmer-sh to the published SDK
    needs:
      - publish
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.publish.result == 'success' || inputs.sync_only == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Select the published SDK version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^wasmer-sdk-js-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "WASMER_SDK_VERSION=${RELEASE_TAG#wasmer-sdk-js-v}" >> "$GITHUB_ENV"

      - name: Update wasmer-sh package manifests
        run: node .github/scripts/sync-wasmer-sh-sdk-version.mjs

      - name: Wait for npm registry processing
        run: node .github/scripts/wait-for-npm-release.mjs

      - name: Regenerate dependency lockfiles
        run: |
          npm --prefix wasmer-sh install --package-lock-only --ignore-scripts
          npm --prefix wasmer-sh/service-worker install \
            --package-lock-only --ignore-scripts
          # This exact SDK version was trusted-published by the preceding job,
          # so it must be exempt from pnpm's default 24-hour quarantine here.
          pnpm --dir wasmer-sh --config.minimum-release-age=0 install \
            --lockfile-only --ignore-scripts

      - name: Validate the published dependency
        run: node .github/scripts/sync-wasmer-sh-sdk-version.mjs --check

      - name: Build wasmer-sh from clean installs
        run: |
          npm --prefix wasmer-sh ci --ignore-scripts
          npm --prefix wasmer-sh/service-worker ci --ignore-scripts
          npm --prefix wasmer-sh run build

      - name: Open a pull request for the synchronized dependency
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add \
            wasmer-sh/README.md \
            wasmer-sh/package.json \
            wasmer-sh/package-lock.json \
            wasmer-sh/pnpm-lock.yaml \
            wasmer-sh/src/editor.ts \
            wasmer-sh/src/main.ts \
            wasmer-sh/vite.config.ts \
            wasmer-sh/service-worker/.wasmer/host.ts \
            wasmer-sh/service-worker/package.json \
            wasmer-sh/service-worker/package-lock.json \
            wasmer-sh/service-worker/wasmer-service-worker.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sdk_version="$WASMER_SDK_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m \
            "Use @wasmer/sdk ${sdk_version} in wasmer-sh"
          branch="codex/sync-wasmer-sh-sdk-${sdk_version}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"
          body_file="${RUNNER_TEMP}/sdk-sync-pr.md"
          cat > "${body_file}" <<EOF
          Update the browser shell and HTTP host to the published @wasmer/sdk ${sdk_version}.

          Validation: registry metadata and tarball availability, synchronized lockfiles,
          and a shell build from clean npm installs all passed.
          EOF
          existing_pr="$(gh pr list --head "${branch}" --base main --json number --jq '.[0].number // empty')"
          if [ -z "${existing_pr}" ]; then
            gh pr create --base main --head "${branch}" \
              --title "Use @wasmer/sdk ${sdk_version} in wasmer-sh" \
              --body-file "${body_file}"
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Run CI for the synchronized commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ steps.commit.outputs.branch }}"
