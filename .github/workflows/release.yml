name: Release SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component tag to retry publication (leave empty to prepare release PRs)
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  # Serialize Release Please updates across ordinary merges and manual runs.
  # Component publication keeps its own group so releases can build in parallel.
  group: release-sdk-${{ startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--components--wasmer-sdk-') && github.event.pull_request.head.ref || inputs.tag || 'prepare' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-prs:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--components--wasmer-sdk-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Check for blocked release preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release Please otherwise warns and exits successfully without
          # opening any component PRs when an older release remains untagged.
          pending="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
            --label 'autorelease: pending' --limit 200 --json number,url)"
          if [ "$(jq 'length' <<< "$pending")" -gt 0 ]; then
            echo '::error::Merged release PRs are still pending publication. Recover or supersede them before preparing new releases.'
            {
              echo '### Release preparation is blocked'
              echo
              jq -r '.[] | "- [Release PR #\(.number)](\(.url))"' <<< "$pending"
              echo
              echo 'Recover the failed release, or explicitly supersede an unpublished attempt as described in docs/releases.md. Do not mark it tagged without a real release.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
      - name: Validate the release PRs and prepare Swift binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r pr branch; do
            case "$branch" in
              release-please--branches--main--components--wasmer-sdk-swift)
                gh workflow run prepare-swift-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f pull_request="$pr"
                ;;
              release-please--branches--main--components--wasmer-sdk-js|release-please--branches--main--components--wasmer-sdk-python)
                gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
                ;;
            esac
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --label 'autorelease: pending' --json number,headRefName --jq '.[] | [.number, .headRefName] | @tsv')

  select:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag != '' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--components--wasmer-sdk-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    outputs:
      component: ${{ steps.select.outputs.component }}
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
      build_run_id: ${{ steps.select.outputs.build_run_id }}
      retry: ${{ steps.select.outputs.retry }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: select
        name: Validate the component and exact release source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^wasmer-sdk-(js|python|swift)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            component="${BASH_REMATCH[1]}"
            gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo 'retry=true' >> "$GITHUB_OUTPUT"
          else
            [[ "$HEAD_BRANCH" =~ ^release-please--branches--main--components--wasmer-sdk-(js|python|swift)$ ]]
            component="${BASH_REMATCH[1]}"
            echo 'retry=false' >> "$GITHUB_OUTPUT"
          fi
          version="$(python .github/scripts/sdk_release.py check --component "$component")"
          tag="wasmer-sdk-${component}-v${version}"
          if [ -n "$REQUESTED_TAG" ]; then test "$REQUESTED_TAG" = "$tag"; fi
          if [ "$component" = swift ]; then
            python .github/scripts/sdk_release.py verify-swift-inputs
            echo "build_run_id=$(jq -r .build_run_id swift/release-artifacts.json)" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "component=$component"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Retrieve the prepared Swift archive before creating its tag
        if: steps.select.outputs.component == 'swift' && steps.select.outputs.retry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-release-swift
          path: release-dist
          run-id: ${{ steps.select.outputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the prepared Swift archive
        if: steps.select.outputs.component == 'swift' && steps.select.outputs.retry != 'true'
        run: python .github/scripts/sdk_release.py verify --component swift --assets release-dist
      - name: Create this component's draft release and tag
        if: steps.select.outputs.retry != 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please/${{ steps.select.outputs.component }}.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true
      - name: Verify tag identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
          RELEASE_SHA: ${{ steps.select.outputs.sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" = "$RELEASE_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  build:
    needs: select
    if: needs.select.outputs.retry != 'true' && needs.select.outputs.component != 'swift'
    uses: ./.github/workflows/build-release.yml
    with:
      component: ${{ needs.select.outputs.component }}
      sha: ${{ needs.select.outputs.sha }}

  artifacts:
    needs: [select, build]
    if: always() && needs.select.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        if: needs.select.outputs.retry != 'true'
        with:
          name: sdk-release-${{ needs.select.outputs.component }}
          path: release-dist
          run-id: ${{ needs.select.outputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Upload tested artifacts and publish the complete GitHub release
        if: needs.select.outputs.retry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.select.outputs.component }}
        run: python .github/scripts/github_release.py upload --component "$COMPONENT" --assets release-dist
      - name: Verify existing GitHub release artifacts for a publication retry
        if: needs.select.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.select.outputs.component }}
        run: python .github/scripts/github_release.py download --component "$COMPONENT" --assets release-dist

  publish-python:
    needs: [select, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.select.outputs.component == 'python'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download and verify the exact GitHub release wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/github_release.py download --component python --assets release-dist
          python .github/scripts/registry_pending.py --component python --assets release-dist --output pending
      - id: pending
        run: echo "count=$(find pending -name '*.whl' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pending.outputs.count != '0'
        with:
          packages-dir: pending/

  publish-javascript:
    needs: [select, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.select.outputs.component == 'js'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
        run: gh workflow run publish-npm.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
