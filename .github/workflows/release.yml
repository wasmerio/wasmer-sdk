name: Release Python

on:
  workflow_dispatch:
    inputs:
      version:
        description: Python version to prepare
        required: true
        default: "0.1.0"
        type: string
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: release-python
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-please:
    name: Release Please
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs['python--release_created'] }}
      release_sha: ${{ steps.release.outputs['python--sha'] }}
      version: ${{ steps.release.outputs['python--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.version }}
          target-branch: main

  build-python-wheels:
    name: Python wheel (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Validate Python release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: python .github/scripts/check-release-version.py "v${RELEASE_VERSION}"

      - name: Build native module and wheel
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        run: |
          python -m pip install --upgrade build
          python python/scripts/build.py --release
          python -m build --wheel --outdir wheelhouse python

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf
          python -m pip install --upgrade auditwheel
          auditwheel repair wheelhouse/*.whl --wheel-dir repaired
          rm wheelhouse/*.whl
          mv repaired/*.whl wheelhouse/

      - name: Test the installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          python -m unittest discover -s python/tests -p test_runtime.py -v
          python -m unittest discover -s python/tests -p test_postgres_psql.py -v

      - name: Test Edge.js from the installed wheel
        shell: bash
        run: |
          for attempt in {1..3}; do
            if python -m unittest discover -s python/tests -p test_edgejs_http.py -v; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-sdk-${{ needs.release-please.outputs.version }}-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-python:
    name: Publish wasmer-sdk
    needs:
      - release-please
      - build-python-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wasmer-sdk-${{ needs.release-please.outputs.version }}-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
