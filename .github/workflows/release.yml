name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check manifest and tag versions
        run: python3 .github/scripts/check-release-version.py "${GITHUB_REF_NAME}"

      - name: Check registry availability
        if: github.run_attempt == 1
        run: python3 .github/scripts/check-release-version.py "${GITHUB_REF_NAME}" --check-registries --skip-crates

  build-rust:
    name: Build Rust and UniFFI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Test native crates
        run: |
          cargo +1.94.0 test --locked -p wasmer-sdk --all-targets
          cargo +1.94.0 test --locked -p wasmer-sdk-uniffi --lib

      - name: Build release artifacts
        run: |
          cargo +1.94.0 build --locked --release -p wasmer-sdk
          cargo +1.94.0 build --locked --release -p wasmer-sdk-uniffi --features bindgen-cli --lib --bin uniffi-bindgen

      # crates.io publishing is intentionally disabled while wasmer-sdk relies
      # on runtime-hook APIs that only exist on Wasmer's `sdk` branch.
      #
      # - name: Publish wasmer-sdk
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #   run: cargo +1.94.0 publish --locked -p wasmer-sdk
      #
      # - name: Publish wasmer-sdk-uniffi
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #   run: cargo +1.94.0 publish --locked -p wasmer-sdk-uniffi

  publish-javascript:
    name: Publish JavaScript
    needs: build-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          cargo +nightly install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build and test
        working-directory: js
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm test
          npm run test:browser

      - name: Test Edge.js
        working-directory: js
        run: |
          for attempt in {1..3}; do
            if npm run test:edgejs; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Publish to npm
        working-directory: js
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@wasmer/sdk@${version}" version >/dev/null 2>&1; then
            echo "@wasmer/sdk ${version} is already published"
          else
            npm publish
          fi

  build-python-wheels:
    name: Python wheel (${{ matrix.name }})
    needs: build-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Build native module and wheel
        shell: bash
        run: |
          python -m pip install --upgrade build
          python python/scripts/build.py --release
          python -m build --wheel --outdir wheelhouse python

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf
          python -m pip install --upgrade auditwheel
          auditwheel repair wheelhouse/*.whl --wheel-dir repaired
          rm wheelhouse/*.whl
          mv repaired/*.whl wheelhouse/

      - name: Test the installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          python -m unittest discover -s python/tests -p test_runtime.py -v
          python -m unittest discover -s python/tests -p test_boltffi_native.py -v
          python -m unittest discover -s python/tests -p test_postgres_psql.py -v

      - name: Test Edge.js from the installed wheel
        shell: bash
        run: |
          for attempt in {1..3}; do
            if python -m unittest discover -s python/tests -p test_edgejs_http.py -v; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-python:
    name: Publish Python
    needs: build-python-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
