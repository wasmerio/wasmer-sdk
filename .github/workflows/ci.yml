name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust and UniFFI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/cache-sdk
        with:
          cargo-profile: native-1.94-debug

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Test the Rust SDK
        run: cargo +1.94.0 test --locked -p wasmer-sdk --all-targets

      - name: Test and build UniFFI
        run: |
          cargo +1.94.0 test --locked -p wasmer-sdk-uniffi --lib
          cargo +1.94.0 build --locked -p wasmer-sdk-uniffi --features bindgen-cli

      - name: Verify the Rust source package
        run: cargo +1.94.0 package --locked -p wasmer-sdk --no-verify

  javascript:
    name: JavaScript
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - uses: ./.github/actions/cache-sdk
        with:
          cargo-profile: js-nightly
          cache-compiled-artifacts: "false"

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.126"; then
            cargo +nightly install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Build
        working-directory: js
        run: npm run build

      - name: Test
        working-directory: js
        run: npm test

      - name: Test Edge.js
        working-directory: js
        run: |
          for attempt in {1..3}; do
            if npm run test:edgejs; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-sdk-js-${{ github.sha }}
          path: |
            js/dist
            js/pkg
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser
    needs: javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Install browser
        working-directory: js
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: wasmer-sdk-js-${{ github.sha }}
          path: js

      - name: Test Python in the browser
        working-directory: js
        run: npm run test:browser

  python:
    name: Python
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - uses: ./.github/actions/cache-sdk
        with:
          cargo-profile: native-1.94-release

      - name: Check release metadata
        run: python .github/scripts/check-release-version.py

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Build the UniFFI Python module
        run: python python/scripts/build.py --release

      - name: Test local behavior
        env:
          PYTHONPATH: python/src
        run: |
          python -m unittest discover -s python/tests -p test_runtime.py -v
          python -m unittest discover -s python/tests -p test_boltffi_native.py -v
          python -m unittest discover -s python/tests -p test_postgres_psql.py -v

      - name: Test Edge.js
        env:
          PYTHONPATH: python/src
        run: |
          for attempt in {1..3}; do
            if python -m unittest discover -s python/tests -p test_edgejs_http.py -v; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
