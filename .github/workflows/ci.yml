name: SDK browser verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    name: Complete browser suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
        working-directory: js
      - name: Align home ownership
        run: chown "$(id -u):$(id -g)" "$HOME"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42293404907
          name: wasmer-sdk-js-b18ce70254162470a4cb2f3c93ee4115a0d7b2d9
          path: js
      - name: Test browser runtimes
        working-directory: js
        run: npm run test:browser
      - name: Test PostgreSQL and Pi shell examples with the built SDK
        working-directory: wasmer-sh
        run: |
          npm ci
          npm install --no-save --package-lock=false ../js
          WASMER_EXAMPLE=postgres,pi npm run test:examples
