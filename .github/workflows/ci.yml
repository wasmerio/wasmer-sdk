name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check component versions and release tooling
        run: |
          for component in js python swift; do
            python .github/scripts/sdk_release.py check --component "$component"
          done
          python -m unittest discover -s .github/scripts/tests -v
      - name: Require a prepared Swift release
        if: >-
          github.head_ref == 'release-please--branches--main--components--wasmer-sdk-swift' ||
          github.ref_name == 'release-please--branches--main--components--wasmer-sdk-swift'
        run: python .github/scripts/sdk_release.py verify-swift-inputs

  rust:
    name: Rust and UniFFI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Cache restoration is optional; bound downloads and archive extraction.
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: native-1.95

      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Test the Rust SDK
        run: cargo +1.95.0 test --locked -p wasmer-sdk --all-targets

      - name: Test and build UniFFI
        run: |
          cargo +1.95.0 test --locked -p wasmer-sdk-uniffi --lib
          cargo +1.95.0 build --locked -p wasmer-sdk-uniffi --features bindgen-cli

      - name: Verify the Rust source package
        run: cargo +1.95.0 package --locked -p wasmer-sdk --no-verify

  swift:
    name: Swift (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Cache restoration is optional; bound downloads and archive extraction.
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: swift-1.95-sys
          cache-compiled-artifacts: "false"

      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Build the UniFFI Swift package
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: python3 swift/scripts/build.py

      - name: Test Swift against local Wasm fixtures
        run: python3 swift/scripts/test.py

  swift-webkit:
    name: Swift (WebKit backend)
    needs: javascript
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - uses: actions/download-artifact@v4
        with:
          name: wasmer-sdk-js-${{ github.sha }}
          path: js
      - name: Generate the WebKit runtime from the tested JS build
        run: python3 swift/WasmerWKSDK/scripts/bundle_sdk.py
      - name: Verify generated runtime and simulator selection
        run: |
          python3 swift/WasmerWKSDK/scripts/bundle_sdk.py --check
          python3 -m unittest discover -s swift/WasmerWKSDK/scripts -p 'test_*.py'
      - name: Test native filesystem, DNS, TCP, and HTTP bridges
        run: swift test --package-path swift/WasmerWKSDK
      - name: Test worker transport and JSPI
        run: node --test swift/WasmerWKSDK/scripts/*.test.mjs
      - name: Build and test the distributable runtime
        run: |
          python3 swift/WasmerWKSDK/scripts/build_runtime.py
          python3 swift/WasmerWKSDK/scripts/verify_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-sdk-webkit-${{ github.sha }}
          path: swift/Artifacts/WasmerWKRuntime.zip
          if-no-files-found: error

  javascript:
    name: JavaScript
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json

      # Cache restoration is optional; bound downloads and archive extraction.
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: js-nightly
          cache-compiled-artifacts: "false"

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.126"; then
            cargo +nightly install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Build
        working-directory: js
        run: npm run build

      - name: Test
        working-directory: js
        run: npm test

      - name: Test task serialization
        working-directory: js
        run: npm run test:bindgen

      - name: Test Edge.js
        working-directory: js
        run: npm run test:edgejs

      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-sdk-js-${{ github.sha }}
          path: |
            js/dist
            js/pkg
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser
    needs: javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Install browser
        working-directory: js
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: wasmer-sdk-js-${{ github.sha }}
          path: js

      - name: Test Python in the browser
        working-directory: js
        run: npm run test:browser

  python:
    name: Python
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # Cache restoration is optional; bound downloads and archive extraction.
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: native-1.95-release

      - name: Check release metadata
        run: python .github/scripts/check-release-version.py

      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Build the UniFFI Python module
        run: python python/scripts/build.py --release

      - name: Test local behavior
        env:
          PYTHONPATH: python/src
        run: |
          python -m unittest discover -s python/tests -p test_runtime.py -v
          python -m unittest discover -s python/tests -p test_package_definition.py -v
          python -m unittest discover -s python/tests -p test_postgres_psql.py -v

      - name: Test Edge.js
        env:
          PYTHONPATH: python/src
        run: |
          for attempt in {1..3}; do
            if python -m unittest discover -s python/tests -p test_edgejs_http.py -v; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
