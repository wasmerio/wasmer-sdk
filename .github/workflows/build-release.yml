name: Build release artifacts

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  javascript:
    if: inputs.component == 'js'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      # Cache restoration is optional; bound downloads and archive extraction.
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: js-nightly
          cache-compiled-artifacts: 'false'
      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.126'; then
            cargo +nightly install wasm-bindgen-cli --version 0.2.126 --locked --force
          fi
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - name: Test Node and browser builds
        working-directory: js
        run: |
          timeout --kill-after=30s 6m npm test
          npm run test:bindgen
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser
      - name: Pack the tested build
        working-directory: js
        run: |
          mkdir -p ../release-build
          npm pack --pack-destination ../release-build
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-js
          path: release-build/*.tgz
          if-no-files-found: error

  python:
    if: inputs.component == 'python'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            backend: napi-v8
          - name: linux-arm64
            os: ubuntu-22.04-arm
            backend: sys
          - name: macos-arm64
            os: macos-15
            backend: napi-v8
          - name: macos-x86_64
            os: macos-15-intel
            backend: sys
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Cache restoration is optional; bound downloads and archive extraction.
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: native-1.95-release-${{ matrix.backend }}
      - run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Build the native module and wheel
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          SDK_BACKEND: ${{ matrix.backend }}
        run: |
          python -m pip install --upgrade build
          python python/scripts/build.py --release --backend "$SDK_BACKEND"
          python -m build --wheel --outdir wheelhouse python
      - name: Repair Linux wheels
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade auditwheel patchelf==0.19.1.0
          auditwheel repair wheelhouse/*.whl --wheel-dir repaired
          rm wheelhouse/*.whl
          mv repaired/*.whl wheelhouse/
      - name: Test the installed wheel
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          python -m unittest discover -s python/tests -p test_runtime.py -v
          python -m unittest discover -s python/tests -p test_package_definition.py -v
          python -m unittest discover -s python/tests -p test_postgres_psql.py -v
      - name: Test native N-API
        if: matrix.backend == 'napi-v8'
        shell: bash
        run: |
          for attempt in {1..3}; do
            if python -m unittest discover -s python/tests -p test_edgejs_http.py -v; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-python-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  go:
    if: inputs.component == 'go'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
            backend: napi-v8
          - target: linux-arm64
            os: ubuntu-22.04-arm
            backend: sys
          - target: darwin-amd64
            os: macos-15-intel
            backend: sys
          - target: darwin-arm64
            os: macos-15
            backend: napi-v8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: ./.github/actions/cache-sdk
        timeout-minutes: 5
        continue-on-error: true
        with:
          cargo-profile: native-1.95-release-${{ matrix.backend }}
      - run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - if: runner.os == 'Linux'
        run: python -m pip install patchelf==0.19.1.0
      - name: Build native libraries and bindings
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: python go/scripts/build.py --release
      - name: Install the PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              brew install libpq
              echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
            fi
          fi
      - name: Test both link modes and registry workloads
        env:
          WASMER_GO_INTEGRATION: '1'
          WASMER_GO_REQUIRE_PSQL: '1'
          WASMER_GO_NAPI: ${{ matrix.backend == 'napi-v8' && '1' || '0' }}
        run: |
          python go/scripts/test.py --link static --race
          python go/scripts/test.py --link dynamic
      - name: Run Go examples
        env:
          SDK_BACKEND: ${{ matrix.backend }}
        run: |
          python go/scripts/run_example.py python
          python go/scripts/run_example.py postgres_psql
          if [ "$SDK_BACKEND" = napi-v8 ]; then
            python go/scripts/run_example.py multiple_runtimes
            python go/scripts/run_example.py edgejs_http
          fi
      - name: Package the tested native libraries
        env:
          GO_TARGET: ${{ matrix.target }}
        run: python .github/scripts/go_release.py native --native "go/Artifacts/$GO_TARGET" --assets release-build
      - name: Test installation from the packaged bytes
        run: |
          mkdir -p go/.build/release
          cp release-build/*.tar.gz go/.build/release/
          python .github/scripts/go_release.py module --local --assets go/.build/release
          python go/scripts/test_release.py --assets go/.build/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-go-${{ matrix.target }}
          path: release-build/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'darwin-arm64'
        with:
          name: go-generated-source
          path: go/internal/ffi/wasmer_sdk_uniffi.*
          if-no-files-found: error

  bundle:
    needs: [javascript, python, go]
    if: >-
      always() &&
      (needs.javascript.result == 'success' || needs.python.result == 'success' || needs.go.result == 'success') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-build-${{ inputs.component }}*
          merge-multiple: true
          path: release-dist
      - uses: actions/download-artifact@v4
        if: inputs.component == 'go'
        with:
          name: go-generated-source
          path: go/internal/ffi
      - name: Assemble the release-only Go module
        if: inputs.component == 'go'
        run: python .github/scripts/go_release.py module --assets release-dist
      - name: Validate the complete artifact set and record checksums
        env:
          COMPONENT: ${{ inputs.component }}
        run: python .github/scripts/sdk_release.py seal --component "$COMPONENT" --assets release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-release-${{ inputs.component }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 90
