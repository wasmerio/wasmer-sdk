[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmer-sdk"
version = "0.1.0"
description = "Python bindings for the Wasmer sandbox SDK"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["wasmer_sdk"]

[tool.setuptools.package-data]
wasmer_sdk = ["*.dylib", "*.so", "*.dll", "py.typed"]
