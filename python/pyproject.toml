[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmer-sdk"
version = "0.4.0"
description = "Python bindings for the Wasmer sandbox SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Wasmer-Modified-MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/wasmerio/wasmer-sdk"
Repository = "https://github.com/wasmerio/wasmer-sdk"
Issues = "https://github.com/wasmerio/wasmer-sdk/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["wasmer_sdk"]

[tool.setuptools.package-data]
wasmer_sdk = ["*.dylib", "*.so", "*.dll", "py.typed"]
