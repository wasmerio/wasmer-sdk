[workspace]
members = [
    "js/bindgen",
    "rust",
    "rust/boltffi",
    "rust/uniffi",
]
default-members = ["rust"]
exclude = [
    "packages/edgejs",
    "packages/napi",
]
resolver = "2"

[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "f9753d4ac142ad8dcc69024b7f1786178a0e431d" }
