[workspace]
members = [
    "js/bindgen",
    "rust",
    "rust/uniffi",
]
default-members = ["rust"]
exclude = [
    "packages/edgejs",
    "packages/gui",
    "packages/napi",
    "packages/webgpu",
]
resolver = "2"

[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
virtual-mio = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
virtual-net = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-config = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-gui = { git = "https://github.com/wasmerio/gui.git", rev = "41dac65c3a171e4339ac5645c1d67c0918fd6774" }
wasmer-napi = { git = "https://github.com/wasmerio/napi.git", rev = "961566eb3459630ffe831328c9f75cec7aad6ec6" }
wasmer-package = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-wasix-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-webgpu = { git = "https://github.com/wasmerio/webgpu.git", rev = "c65e1e3a0447070ffe97d7ed377b4d53a0788112" }

# NAPI's vendored manifest uses sibling Wasmer crates. Resolve those
# dependencies from the same runtime revision as the rest of this workspace.
[patch."https://github.com/wasmerio/napi.git"]
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "4b71ca8e2ca5283047b793a7bee4495198e2c6a3" }
