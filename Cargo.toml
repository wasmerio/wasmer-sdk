[package]
name = "wasmer-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A portable, package-first sandbox SDK powered by Wasmer"
license = "MIT"
repository = "https://github.com/wasmerio/wasmer-sdk"

[features]
default = ["sys"]
sys = ["wasmer/cranelift", "wasmer-wasix/sys-default"]
js = ["wasmer-wasix/js", "virtual-fs/js"]

[dependencies]
anyhow = "1.0"
bytes = "1.11"
thiserror = "2.0"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
virtual-fs = { version = "=0.702.0", default-features = false }
wasmer = { version = "=7.2.0", default-features = false }
wasmer-config = "=0.702.0"
wasmer-package = "=0.702.0"
wasmer-wasix = { version = "=0.702.0", default-features = false }

[dev-dependencies]
tempfile = "3.23"
wat = "1.244"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
