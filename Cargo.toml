[workspace]
members = [
    "js/bindgen",
    "rust",
    "rust/uniffi",
]
default-members = ["rust"]
exclude = [
    "packages/edgejs",
    "packages/napi",
]
resolver = "2"

[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
virtual-mio = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
virtual-net = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-config = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-napi = { git = "https://github.com/wasmerio/napi.git", rev = "961566eb3459630ffe831328c9f75cec7aad6ec6" }
wasmer-package = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-wasix-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }

# NAPI's vendored manifest uses sibling Wasmer crates. Resolve those
# dependencies from the same runtime revision as the rest of this workspace.
[patch."https://github.com/wasmerio/napi.git"]
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "4ae846a7beab4d654c4f7e16df1478670edf6ac9" }
