[workspace]
members = [
    "js/bindgen",
    "rust",
    "rust/uniffi",
]
default-members = ["rust"]
exclude = [
    "packages/edgejs",
    "packages/gui",
    "packages/napi",
    "packages/webgpu",
]
resolver = "2"

[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
virtual-mio = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
virtual-net = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-config = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-gui = { git = "https://github.com/wasmerio/gui.git", rev = "41dac65c3a171e4339ac5645c1d67c0918fd6774" }
wasmer-napi = { git = "https://github.com/wasmerio/napi.git", rev = "18209d2c80dd1404644fbbd88eff4771993e142f" }
wasmer-package = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-wasix-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-webgpu = { git = "https://github.com/wasmerio/webgpu.git", rev = "c65e1e3a0447070ffe97d7ed377b4d53a0788112" }

# NAPI's vendored manifest uses sibling Wasmer crates. Resolve those
# dependencies from the same runtime revision as the rest of this workspace.
[patch."https://github.com/wasmerio/napi.git"]
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "d8f779830d0fd0e6b8fef77b9b8a5af33affd42c" }
