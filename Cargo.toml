[workspace]
members = [
    "js/bindgen",
    "rust",
    "rust/uniffi",
]
default-members = ["rust"]
exclude = [
    "packages/edgejs",
    "packages/napi",
]
resolver = "2"

[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
virtual-mio = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
virtual-net = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-config = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-napi = { git = "https://github.com/wasmerio/napi.git", rev = "8426b5ecfa89211f18d2df7976ea3a3d9ec6109b" }
wasmer-package = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-wasix-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }

# NAPI's vendored manifest uses sibling Wasmer crates. Resolve those
# dependencies from the same runtime revision as the rest of this workspace.
[patch."https://github.com/wasmerio/napi.git"]
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "26230b0676ccf07def18586b5d0781b66d96ec9c" }
