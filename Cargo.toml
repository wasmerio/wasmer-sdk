[workspace]
members = [
    "js/bindgen",
    "rust",
    "rust/boltffi",
    "rust/uniffi",
]
default-members = ["rust"]
resolver = "2"

[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
virtual-mio = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
virtual-net = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer-config = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer-package = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
wasmer-wasix-types = { git = "https://github.com/wasmerio/wasmer.git", branch = "sdk" }
