[package]
name = "wasmer-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A portable, package-first sandbox SDK powered by Wasmer"
license-file = "LICENSE"
repository = "https://github.com/wasmerio/wasmer-sdk"

[features]
default = ["sys"]
sys = [
  "virtual-fs/host-fs",
  "wasmer/cranelift",
  "wasmer-wasix/sys-default",
]
napi-v8 = [
  "sys",
  "dep:wasmer-napi",
  "wasmer-napi/wasix",
]
js = [
  "dep:web-sys",
  "wasmer-wasix/js",
  "virtual-fs/js",
]
js-napi = [
  "js",
  "dep:wasmer-napi",
  "wasmer/experimental-async",
  "wasmer-napi/js",
  "wasmer-napi/wasix",
]
# Windows and input for guests built against <wasmer/gui.h>. Headless unless
# the embedder gives its `GuiCtx` a window system.
gui = [
  "sys",
  "dep:wasmer-gui",
  "wasmer-gui/wasix",
]
# The desktop's windows for GUI guests, through winit, with the system
# clipboard, and with frames that guests without a GPU draw themselves. A
# window system wants the process's main thread: see `gui::run_main`.
gui-window = [
  "gui",
  "wasmer-gui/winit",
  "wasmer-gui/clipboard",
  "wasmer-gui/pixels",
]
# Lets WebGPU guests draw on GUI windows. On the desktop's windows
# (`gui-window`) this needs a wasmer-webgpu whose `WindowTarget` has
# `pre_present` and `wait_presentable`.
gui-webgpu = [
  "gui",
  "webgpu",
  "wasmer-gui/webgpu",
]
# WebGPU for guests built against webgpu.h: on wgpu natively, on the
# JavaScript realm's `navigator.gpu` in a browser.
webgpu = [
  "sys",
  "dep:wasmer-webgpu",
  "wasmer-webgpu/wasix",
]
# Windows and input in a browser: canvases of the page as guests' windows.
js-gui = [
  "js",
  "dep:wasmer-gui",
  "wasmer-gui/js",
  "wasmer-gui/wasix",
]
js-webgpu = [
  "js",
  "dep:wasmer-webgpu",
  "wasmer/experimental-async",
  "wasmer-webgpu/js",
  "wasmer-webgpu/wasix",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.11"
crossbeam-queue = "0.3"
futures = "0.3"
instant = { version = "0.1", features = ["wasm-bindgen"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-util", "macros", "rt", "sync", "time"] }
virtual-fs = { version = "=0.704.0", default-features = false }
wasmer = { version = "=7.4.0", default-features = false }
wasmer-c-api-imports = { version = "=7.4.0", default-features = false, features = ["wasi"] }
wasmer-config = "=0.704.0"
wasmer-package = { version = "=0.704.0", default-features = false }
wasmer-types = { version = "=7.4.0", default-features = false }
wasmer-wasix = { version = "=0.704.0", default-features = false }
wasmer-wasix-types = "=0.704.0"
webc = { version = "=12.0.1", default-features = false, features = ["v3"] }
wasmer-gui = { version = "=0.704.0", optional = true, default-features = false }
wasmer-webgpu = { version = "=0.704.0", optional = true, default-features = false }
wasmparser = { version = "=0.257.1", default-features = false, features = ["std", "simd"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.49", features = ["fs", "rt-multi-thread"] }
wasmer-napi = { version = "=0.704.0", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"], optional = true }
wasmer-napi = { version = "=0.704.0", optional = true, default-features = false }

[dev-dependencies]
http = "1.4"
serde_json = "1.0"
tempfile = "3.23"
wat = "1.244"

# Opens a real window, so it has a `main` of its own for the window system
# to have the main thread, and only runs when asked to (see the file).
[[test]]
name = "gui_window"
path = "tests/gui_window.rs"
harness = false
required-features = ["gui-window"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
