[package]
name = "wasmer-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A portable, package-first sandbox SDK powered by Wasmer"
license = "MIT"
repository = "https://github.com/wasmerio/wasmer-sdk"

[features]
default = ["sys"]
sys = [
  "virtual-fs/host-fs",
  "wasmer/cranelift",
  "wasmer-package/authoring",
  "wasmer-wasix/sys-default",
]
js = [
  "dep:web-sys",
  "wasmer-wasix/js",
  "virtual-fs/js",
]
js-napi = [
  "js",
  "dep:wasmer-napi",
  "wasmer/experimental-async",
  "wasmer-napi/js",
  "wasmer-napi/wasix",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.11"
futures = "0.3"
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-util", "macros", "rt", "sync", "time"] }
virtual-fs = { version = "=0.702.1", default-features = false }
wasmer = { version = "=7.2.1", default-features = false }
wasmer-c-api-imports = { version = "=7.2.1", default-features = false, features = ["wasi"] }
wasmer-config = "=0.702.1"
wasmer-package = { version = "=0.702.1", default-features = false, features = ["execution", "webc-v3"] }
wasmer-wasix = { version = "=0.702.1", default-features = false }
wasmer-wasix-types = "=0.702.1"
webc = { version = "=12.0.0", default-features = false, features = ["v3"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.49", features = ["fs", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"], optional = true }
wasmer-napi = { version = "=0.702.1", path = "../packages/napi", optional = true, default-features = false }

[dev-dependencies]
http = "1.4"
serde_json = "1.0"
tempfile = "3.23"
wat = "1.244"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
