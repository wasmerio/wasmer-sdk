<!doctype html>
<html lang="en" data-state="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Run Unix commands in your browser with Wasmer, WASIX, and the Wasmer JavaScript SDK."
    />
    <meta name="theme-color" content="#09090d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>wasmer.sh — Unix in your browser</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="app-bar">
      <a class="brand" href="/" aria-label="Restart the default Wasmer shell">
        <svg
          class="brand-mark"
          viewBox="0 0 28 28"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M14 2.5 24 8.25v11.5L14 25.5 4 19.75V8.25L14 2.5Z" />
          <path d="m8.2 10.2 3.25 8.1L14 12.7l2.55 5.6 3.25-8.1" />
        </svg>
        <span>wasmer<span class="brand-dot">.</span>sh</span>
      </a>

      <div class="session-summary" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="session-status">Preparing runtime</span>
        <span class="summary-divider" aria-hidden="true"></span>
        <span id="package-name">sharrattj/bash</span>
      </div>

      <nav class="app-actions" aria-label="Shell actions">
        <button id="clear-button" class="text-button" type="button">
          Clear
        </button>
        <button id="restart-button" class="text-button" type="button">
          Restart
        </button>
        <a
          class="icon-link"
          href="https://github.com/wasmerio/wasmer-sdk"
          target="_blank"
          rel="noreferrer"
          aria-label="Open the Wasmer SDK repository"
          title="Wasmer SDK on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.58 9.58 0 0 1 12 6.82c.85 0 1.7.11 2.5.34 1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
            />
          </svg>
        </a>
      </nav>
    </header>

    <main class="shell-stage">
      <section class="terminal-frame" aria-label="Wasmer shell terminal">
        <div id="terminal"></div>

        <div class="boot-screen" role="status">
          <div class="boot-card">
            <div class="runtime-glyph" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p class="eyebrow">WebAssembly + WASIX</p>
            <h1 id="boot-title">Starting your shell</h1>
            <p id="boot-detail">
              Initializing the Wasmer runtime in this browser.
            </p>
            <button id="retry-button" class="primary-button" type="button" hidden>
              Try again
            </button>
          </div>
        </div>
      </section>

      <section id="preview-panel" class="preview-panel" aria-label="Web server preview" hidden>
        <header class="preview-bar">
          <span id="preview-title">Web preview</span>
          <div class="preview-actions">
            <a id="preview-open" class="text-button" target="_blank" rel="noreferrer">Open</a>
            <button id="preview-close" class="text-button" type="button">Close</button>
          </div>
        </header>
        <div id="preview-content" class="preview-content"></div>
      </section>
    </main>

    <noscript>
      <div class="noscript-message">
        wasmer.sh needs JavaScript to start the WebAssembly runtime.
      </div>
    </noscript>
  </body>
</html>
