allowBuilds:
  # wisp-js only uses bufferutil from its Node WebSocket implementation. The
  # browser client is pure JavaScript, so the native addon is unnecessary.
  bufferutil: false

# @wasmer/sdk is our first-party release and is intentionally consumed by
# wasmer-sh immediately after publishing. Exempt only this package so automated
# SDK version bumps keep working while pnpm protects every third-party package.
minimumReleaseAgeExclude:
  - '@wasmer/sdk'
