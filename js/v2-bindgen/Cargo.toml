[package]
name = "wasmer-sdk-browser-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license-file = "../../LICENSE"

# This graph deliberately excludes the v1 native SDK and its runtime.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.129"
wasixv2 = { git = "https://github.com/wasmerio/wasmer.git", rev = "25e60218af5d165727f7cdb06439fd61464ef8e4", default-features = false, features = ["browser", "wasix1"] }
wasixv2-host = { git = "https://github.com/wasmerio/wasmer.git", rev = "25e60218af5d165727f7cdb06439fd61464ef8e4", features = ["browser"] }
wasixv2-kernel = { git = "https://github.com/wasmerio/wasmer.git", rev = "25e60218af5d165727f7cdb06439fd61464ef8e4" }
wasixv2-vfs = { git = "https://github.com/wasmerio/wasmer.git", rev = "25e60218af5d165727f7cdb06439fd61464ef8e4" }
wasixv2-abi = { git = "https://github.com/wasmerio/wasmer.git", rev = "25e60218af5d165727f7cdb06439fd61464ef8e4" }
wasixv2-stdio-web = { git = "https://github.com/wasmerio/wasmer.git", rev = "25e60218af5d165727f7cdb06439fd61464ef8e4" }
wat = "1.258"
