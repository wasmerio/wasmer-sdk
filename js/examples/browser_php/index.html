<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasmer · PHP in the browser</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #0b0a10; color: #f4f0fa; }
      main { box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; gap: 18px; min-height: 100vh; padding: 24px; }

      #status { color: #bca9d6; font: 13px ui-monospace, monospace; }
      iframe { width: 100%; height: 100%; min-height: 540px; border: 1px solid #30273e; border-radius: 14px; background: white; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>PHP, served from WASIX</h1><span id="status">Starting…</span></header>
