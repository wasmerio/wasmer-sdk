[package]
name = "wasmer-sdk-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "wasm-bindgen facade for wasmer-sdk"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.11"
console_error_panic_hook = "0.1"
derivative = "2"
futures = "0.3"
http = "1.4"
httparse = "1.10"
instant = { version = "0.1", features = ["wasm-bindgen"] }
js-sys = "0.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tokio = { version = "1.49", default-features = false, features = ["io-util", "sync"] }
tracing = { version = "0.1", features = ["release_max_level_debug"] }
virtual-net = { version = "=0.702.1", default-features = false }
virtual-mio = { version = "=0.702.1", default-features = false }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
wasmer = { version = "=7.2.1", default-features = false, features = ["js", "js-default"] }
wasmer-sdk = { path = "../../rust", default-features = false, features = ["js-napi"] }
wasmer-package = { version = "=0.702.1", default-features = false, features = ["execution", "webc-v3"] }
wasmer-wasix = { version = "=0.702.1", default-features = false, features = ["js", "js-default"] }
wasmer-wasix-types = "=0.702.1"
wasmer-types = "=7.2.1"
webc = { version = "=12.0.0", default-features = false, features = ["v3"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "BlobPropertyBag",
    "Cache",
    "CacheStorage",
    "console",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "MessageEvent",
    "Navigator",
    "Response",
    "Url",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "WorkerOptions",
    "WorkerType",
]

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
